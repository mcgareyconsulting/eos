<?xml version="1.0" encoding="UTF-8"?>
<svg class="hpb-logo" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="136.625 21.000 605.000 242.250">
<defs><style>
  /* Lap 5.25s: draw-on 2.4 | hold 0.3 | one continuous roll-off 2.55.
     Each keyframe boundary meets at zero velocity (ease-out into the hold,
     ease-in out of it), so there's no speed jump anywhere in the lap. */
  @keyframes roll {
    0%    { stroke-dashoffset:1.05; animation-timing-function:cubic-bezier(.65,0,.35,1) }  /* draw on  */
    45.7% { stroke-dashoffset:0;    animation-timing-function:linear }                      /* hold     */
    51.4% { stroke-dashoffset:0;    animation-timing-function:cubic-bezier(.5,0,.5,1) }     /* roll off */
    100%  { stroke-dashoffset:-1.05 }
  }
  /* Neon core (pale, tight blur), mid glow (lagging a hair), wide halo (lagging more). No solid stroke. */
  #pulse       { stroke-dasharray:1 1.2; stroke-dashoffset:1.05; opacity:.95; stroke-opacity:0; animation: roll 5.25s infinite .25s, enter 5.25s infinite .25s }
  #pulse-trail { stroke-dasharray:1 1.2; stroke-dashoffset:1.05; opacity:.85; stroke-opacity:0; animation: roll 5.25s infinite .32s, enter 5.25s infinite .32s }
  #pulse-halo  { stroke-dasharray:1 1.2; stroke-dashoffset:1.05; opacity:.55; stroke-opacity:0; animation: roll 5.25s infinite .42s, enter 5.25s infinite .42s }
  /* Entry: a dash's leading edge reaches the path start 9.69% into its own
     lap (offset 1.05 → 1.0 on the draw-on curve). At that instant both round
     caps appear as a full dot — on the 30-wide halo a visible blob. Each
     layer fades its own stroke in from that moment (same delay as its roll,
     so it lines up per layer); stroke-opacity leaves each layer's base
     opacity alone. */
  @keyframes enter {
    0%, 9.6% { stroke-opacity:0; animation-timing-function:cubic-bezier(.33,0,.5,1) }
    19%, 100% { stroke-opacity:1 }
  }

  /* Residue: on the first lap only, it unrolls behind the trail's tail as
     the live glow rolls off (same curve + delay as #pulse-trail, so its
     leading edge is always hidden under the glow), then stays.
     Dash 2 / offset 2 → 0.95 keeps the visible span exactly [0, tail]. */
  #pulse-ghost { stroke-dasharray:2 2; stroke-dashoffset:2; opacity:0; animation: ghost-in 5.25s .32s forwards }
  @keyframes ghost-in {
    0%, 51.4% { stroke-dashoffset:2;   opacity:0;   animation-timing-function:cubic-bezier(.5,0,.5,1) }
    100%      { stroke-dashoffset:.95; opacity:.4 }
  }

  /* The live group stays dark through the lap boundary (the trail and halo
     finish rolling off just after the core restarts) and is fully up by the
     time the core enters; per-layer entry is handled by `enter` above.
     Fade-out: the live glow eases away over the back half of the roll-off
     in one curve. */
  #pulse-live { animation: dissolve 5.25s infinite .25s }
  @keyframes dissolve {
    0%, 5% { opacity:0 }
    9%   { opacity:1 }
    70%  { opacity:1; animation-timing-function:cubic-bezier(.45,0,.75,1) }
    100% { opacity:0 }
  }

  .once #pulse-live { animation:none; opacity:1 }
  .hpb-logo > g:not(.pulse-wrap), .hpb-logo > path { animation: rise .9s ease-out .9s both }
  @keyframes rise { from { opacity:0 } to { opacity:1 } }   /* opacity only: a CSS transform would override the SVG transform attributes */

  @media (prefers-reduced-motion: reduce) {
    #pulse, #pulse-trail, #pulse-halo, #pulse-live, .hpb-logo > g, .hpb-logo > path { animation:none !important; stroke-dashoffset:0; opacity:1; stroke-opacity:1 }
    #pulse-ghost { opacity:0 !important }
  }
  path[fill="rgb(35.293579%, 37.646484%, 43.136597%)"] { fill:#c9cfdb }
</style><!-- Filter regions are sized to what each blur can actually reach (half the
     stroke width + 3σ, plus slack) around the pulse (x 187.7–689.2,
     y 76.5–207.8). The original percentage regions were ~2× taller than
     needed, and every frame re-blurs the whole region — that cost showed
     up as dropped frames while the full line is lit (early roll-off). -->
<filter id="halo" filterUnits="userSpaceOnUse" x="142" y="31" width="593" height="222"><feGaussianBlur stdDeviation="9"/></filter><filter id="wake" filterUnits="userSpaceOnUse" x="163" y="52" width="550" height="180"><feGaussianBlur stdDeviation="4"/></filter><filter id="soft" filterUnits="userSpaceOnUse" x="177" y="66" width="522" height="152"><feGaussianBlur stdDeviation="1.2"/></filter>
